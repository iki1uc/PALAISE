<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>P · Palais · RAW · Move.Edit · TMP-Cluster</title>

<style>
  body { background:#000; color:#00ffff; font-family:Consolas; padding:20px; }
  h1 { color:#33ccff; text-shadow:0 0 10px #00ffff; margin-bottom:20px; }

  .panel {
    background:#111;
    border:1px solid #333;
    padding:15px;
    margin:20px 0;
    border-radius:8px;
  }

  .panel h2 {
    color:#33ccff;
    margin-top:0;
  }

  pre {
    background:#000;
    border:1px solid #333;
    padding:12px;
    border-radius:6px;
    white-space:pre-wrap;
  }
</style>

<script>
// Datei laden
async function load(path){
  try{
    const r = await fetch("./" + path);
    if(!r.ok) return null;
    return await r.text();
  }catch(e){
    return null;
  }
}

// move.edit laden
async function loadMoveEdit(){
  const txt = await load("move.edit");
  if(!txt) return {};

  const cfg = {};
  txt.split("\n").forEach(line=>{
    if(line.includes(":")){
      const [k,v] = line.split(":");
      cfg[k.trim()] = v.trim();
    }
  });
  return cfg;
}

// Vektor
function vector(content){
  return {
    LEN: content.length,
    LINES: content.split("\n").length,
    STATE: content.includes("ERR") ? "kritisch" : "neutral"
  };
}

// Status
function status(content){
  if(!content) return "FEHLT";
  if(content.includes("ERR")) return "ORANGE";
  return "GRÜN";
}

async function start(){

  const MOVE = await loadMoveEdit();

  const FILES = [
    "P.room",
    "README.md",
    "id.html",
    "move.edit",

    // TMP-Cluster
    "RESPO_ARG_SCAN.tmp",
    "SCHACH.tmp",
    "arg.tmp",
    "bauer.tmp",
    "c.tmp",
    "dame.tmp",
    "edit.tmp",
    "error.tmp",
    "fit.tmp",
    "help.tmp",
    "in.tmp",
    "morph.tmp",
    "nord.tmp",
    "octa.tmp",
    "operator.tmp",
    "ost.tmp",
    "pferd.tmp",
    "q.tmp",
    "schachac.tmp",
    "score.tmp",
    "skat.tmp",
    "sued.tmp",
    "tetriz.tmp",
    "tmp.a",
    "tmp.e",
    "tmp.g",
    "tmp.h",
    "tmp.o",
    "tmp.po.raer.tmp",
    "tmp.s",
    "up.tmp",
    "west.tmp",
    "x.tmp",
    "xarg.tmp",
    "z.tmp"
  ];

  // FILTER
  let filtered = FILES;
  if(MOVE.HIDE){
    filtered = filtered.filter(f => f !== MOVE.HIDE);
  }

  // ORDER
  if(MOVE.ORDER === "asc") filtered.sort();
  if(MOVE.ORDER === "desc") filtered.sort().reverse();

  const out = document.getElementById("out");

  for(const f of filtered){
    const content = await load(f);
    const vec = vector(content || "");

    const div = document.createElement("div");
    div.className = "panel";

    // HIGHLIGHT
    if(MOVE.HIGHLIGHT === f){
      div.style.borderColor = "#ff00ff";
      div.style.boxShadow = "0 0 10px #ff00ff";
    }

    div.innerHTML = `
      <h2>${f} — ${status(content)}</h2>
      <pre>${content ? content.substring(0,300) : "FEHLT"}</pre>
      <pre>
Länge: ${vec.LEN}
Zeilen: ${vec.LINES}
Status: ${vec.STATE}
      </pre>
    `;
    out.appendChild(div);
  }
}
</script>
</head>

<body onload="start()">

<h1>P · Palais · RAW · Move.Edit</h1>

<div id="out"></div>

</body>
</html>
