<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PALAISE · TRUTHFLOW</title>

<style>
body { background:#000; color:#0ff; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; padding:12px; border:1px solid #333; border-radius:6px; }
.neon { color:#0ff; text-shadow:0 0 10px #0ff; }
</style>

<script type="module">

import { PALAISE_TRUTHFLOW } from "./PALAISE.TRUTHFLOW.js";

window.onload = () => {

  const name = "Casanova"; // Beispiel
  const flow = PALAISE_TRUTHFLOW.run(name);

  document.getElementById("truth").textContent =
    JSON.stringify(flow.truth, null, 2);

  document.getElementById("move").textContent =
    JSON.stringify(flow.move, null, 2);

  document.getElementById("respo").textContent =
    JSON.stringify(flow.respo, null, 2);
};

</script>
</head>

<body>

<h1 class="neon">PALAISE · TRUTHFLOW</h1>

<h2>Wahrheit</h2>
<pre id="truth"></pre>

<h2>MOVE.edit</h2>
<pre id="move"></pre>

<h2>RESPO</h2>
<pre id="respo"></pre>

</body>
</html>
