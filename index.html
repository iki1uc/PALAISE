<canvas id="chronik" width="500" height="300"></canvas>

<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";

async function renderChronik(){
    const truth = await PALAISE_RESPO.truth("BEN");

    const c = document.getElementById("chronik");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,500,300);

    ctx.fillStyle = "#fff";
    ctx.fillText("Chronik / Epoche", 20, 40);

    ctx.fillStyle = "#fc0";
    ctx.fillText("Epoche: " + truth.epoche, 20, 80);

    ctx.fillStyle = "#0f0";
    ctx.fillText("ALT: " + truth.time6d.vector[0].toFixed(6), 20, 120);

    ctx.fillStyle = "#6cf";
    ctx.fillText("REAL: " + truth.time6d.vector[2].toFixed(6), 20, 160);

    ctx.fillStyle = "#f0f";
    ctx.fillText("Drift: " + truth.truthFlow.drift.toFixed(6), 20, 200);
}

setInterval(renderChronik, 300);
</script>
