/* ————————————————————————————————
   1) UNIVERSUM-SCANNER
——————————————————————————————— */

async function scanRepo() {
    const res = await fetch("./");
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");

    const files = [...doc.querySelectorAll("a")]
        .map(a => a.getAttribute("href"))
        .filter(f => f.match(/\.(js|json|html)$/));

    return files;
}

/* ————————————————————————————————
   2) UNIVERSUM-LOADER
——————————————————————————————— */

async function loadModules(files) {
    const loaded = [];

    for (const f of files) {
        try {
            if (f.endsWith(".js")) {
                await import(`./${f}`);
                loaded.push({ file: f, type: "js", status: "OK" });
            }
            else if (f.endsWith(".json")) {
                const data = await fetch(`./${f}`).then(r => r.json());
                loaded.push({ file: f, type: "json", status: "OK", data });
            }
            else {
                loaded.push({ file: f, type: "html", status: "OK" });
            }
        } catch (err) {
            loaded.push({ file: f, type: "error", status: "FAIL", error: err });
        }
    }

    return loaded;
}
