<!-- ============================================================
     SCRIPT 1 — ECO Ticker
============================================================ -->
<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";

async function updateECO(){
    const truth = await PALAISE_RESPO.truth("BEN");

    const env = truth.time6d.vector[2]; 
    const comp = truth.pqVector.D0;     
    const ops = truth.move.style;       

    const eco = document.getElementById("ecoTicker");

    eco.innerHTML = `
        ECO‑ENV: REAL=${env.toFixed(6)}  
        ECO‑COMP: PQ‑Root=${comp.toFixed(6)}  
        ECO‑OPS: move.edit=${ops}
    `;
}

setInterval(updateECO, 300);
</script>

<!-- ============================================================
     SCRIPT 2 — Hyperfläche 6D
============================================================ -->
<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";

async function renderHyper6D(){
    const truth = await PALAISE_RESPO.truth("BEN");

    const ALT   = truth.time6d.vector[0];
    const GHOST = truth.time6d.vector[1];
    const REAL  = truth.time6d.vector[2];
    const DRIFT = truth.truthFlow.drift;
    const STAB  = truth.truthFlow.stability === "ALT-dominant" ? 1 : 0;
    const LAGE  = truth.pqVector.D3;

    const c = document.getElementById("hyper6d");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,200);

    for(let x=0;x<600;x++){
        for(let y=0;y<200;y++){
            const u = x/600;
            const v = y/200;

            const w = Math.sin((ALT+GHOST+REAL+DRIFT+STAB+LAGE)*10*u*v);

            const col = Math.floor((w+1)/2*255);

            ctx.fillStyle = `rgb(${col},${255-col},${col})`;
            ctx.fillRect(x,y,1,1);
        }
    }
}

setInterval(renderHyper6D, 200);
</script>

<!-- ============================================================
     SCRIPT 3 — Depth Shader Engine
============================================================ -->
<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";

const canvasD = document.getElementById("engineDepth");
const gl = canvasD.getContext("webgl");

const vs = `
attribute vec3 pos;
uniform mat4 proj;
uniform mat4 view;
uniform mat4 model;
varying float depth;

void main(){
    vec4 world = model * vec4(pos, 1.0);
    depth = world.z;
    gl_PointSize = 8.0;
    gl_Position = proj * view * world;
}
`;

const fs = `
precision mediump float;
varying float depth;
void main(){
    float shade = (depth + 1.0) / 2.0;
    gl_FragColor = vec4(shade, shade*0.5, 0.0, 1.0);
}
`;

function compile(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
}

const vshader = compile(gl.VERTEX_SHADER, vs);
const fshader = compile(gl.FRAGMENT_SHADER, fs);

const prog = gl.createProgram();
gl.attachShader(prog, vshader);
gl.attachShader(prog, fshader);
gl.linkProgram(prog);
gl.useProgram(prog);

const posLoc = gl.getAttribLocation(prog, "pos");
const projLoc = gl.getUniformLocation(prog, "proj");
const viewLoc = gl.getUniformLocation(prog, "view");
const modelLoc = gl.getUniformLocation(prog, "model");

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);

function mat4(){
    return new Float32Array(16);
}

function perspective(fov, aspect, near, far){
    const m = mat4();
    const f = 1.0 / Math.tan(fov/2);
    m[0] = f/aspect;
    m[5] = f;
    m[10] = (far+near)/(near-far);
    m[11] = -1;
    m[14] = (2*far*near)/(near-far);
    return m;
}

function viewMatrix(){
    const m = mat4();
    m[0]=1; m[5]=1; m[10]=1; m[15]=1;
    m[14] = -3;
    return m;
}

let angle = 0;

async function renderDepth(){
    const truth = await PALAISE_RESPO.truth("BEN");

    const ALT = truth.time6d.vector[0];
    const GHOST = truth.time6d.vector[1];
    const REAL = truth.time6d.vector[2];

    const drift = truth.truthFlow.drift;
    angle += drift * 0.05;

    const vertices = new Float32Array([
        ALT, GHOST, REAL,
        -ALT, -GHOST, -REAL
    ]);

    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(posLoc);

    const proj = perspective(1.0, canvasD.width/canvasD.height, 0.1, 10.0);
    const view = viewMatrix();

    const model = mat4();
    model[0] = Math.cos(angle);
    model[1] = -Math.sin(angle);
    model[4] = Math.sin(angle);
    model[5] = Math.cos(angle);
    model[10] = 1;
    model[15] = 1;

    gl.uniformMatrix4fv(projLoc, false, proj);
    gl.uniformMatrix4fv(viewLoc, false, view);
    gl.uniformMatrix4fv(modelLoc, false, model);

    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.drawArrays(gl.POINTS, 0, 2);
}

setInterval(renderDepth, 100);
</script>

<!-- ============================================================
     SCRIPT 4 — PQ Voxel Cube
============================================================ -->
<script type="module">
import { PALAISE_RESPO } from "./PALAISE.RESPO.js";

async function renderVoxel3D(){
    const truth = await PALAISE_RESPO.truth("BEN");
    const hub = truth.pqVector;

    const c = document.getElementById("pqVoxel3d");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,600,350);

    const angle = truth.truthFlow.drift * 10;

    for(let x=0;x<30;x++){
        for(let y=0;y<15;y++){
            const v = Math.sin((hub.D0+hub.D1+hub.D2)*0.5*x*y + angle);

            const col = Math.floor((v+1)/2*255);

            ctx.fillStyle = `rgb(${col},${255-col},${col})`;
            ctx.fillRect(x*20, y*20, 20, 20);
        }
    }
}

setInterval(renderVoxel3D, 200);
</script>
